<div class="flex min-h-screen w-full bg-dark">
  <!-- Sidebar -->
  <app-sidebar (sidebarToggled)="onSidebarToggle($event)"></app-sidebar>

  <!-- Main Content Wrapper -->
  <div
    class="flex flex-1 flex-col transition-all duration-300 ease-in-out"
    [ngClass]="isSidebarCollapsed ? 'ml-[80px]' : 'ml-[250px]'"
  >
    <!-- Top Navigation -->
    <app-topnav></app-topnav>

    <!-- Router Outlet for Dynamic Content -->
    <router-outlet></router-outlet>
  </div>
</div>
