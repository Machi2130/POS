<header class="flex items-center justify-between whitespace-nowrap border-b bg-topnav-bg border-white/10 px-10 h-20 sticky top-0 z-10">
  <!-- Search Bar -->
  <label class="relative flex flex-col min-w-40 max-w-sm">
    <div class="flex w-full flex-1 items-stretch rounded-full h-12">
      <div class="text-gray-400 flex items-center justify-center pl-4">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 400;">search</span>
      </div>
      <input
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-full text-gray-200 focus:outline-0 focus:ring-0 border-none bg-transparent h-full placeholder:text-gray-400 px-2 text-base font-normal leading-normal"
        placeholder="Search..."
      />
    </div>
  </label>

  <!-- Right Side Actions -->
  <div class="flex items-center gap-4">
    <!-- Theme Toggle Button -->
    <button
      (click)="onThemeToggle()"
      class="flex cursor-pointer items-center justify-center rounded-full h-10 w-10 text-gray-300 hover:bg-white/10 transition-all duration-200"
      title="Toggle Theme"
    >
      <span
        class="material-symbols-outlined transition-transform duration-300"
        style="font-variation-settings: 'FILL' 0, 'wght' 400;"
        [class.rotate-180]="!(themeService.isDarkMode$ | async)"
      >
        {{ (themeService.isDarkMode$ | async) ? 'dark_mode' : 'light_mode' }}
      </span>
    </button>

    <!-- Notifications -->
    <button
      (click)="onNotificationClick()"
      class="flex cursor-pointer items-center justify-center rounded-full h-10 w-10 text-gray-300 hover:bg-white/10 transition-colors relative"
      title="Notifications"
    >
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 400;">notifications</span>
      <!-- Notification Badge -->
      <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
    </button>

    <!-- User Avatar with Dropdown -->
    <div class="relative">
      <div
        (click)="onProfileClick()"
        class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 cursor-pointer hover:ring-2 hover:ring-primary transition-all"
        [style.background-image]="'url(' + userAvatar + ')'"
        data-alt="User avatar"
        title="Profile"
      ></div>

      <!-- Profile Dropdown Menu -->
      <div
        *ngIf="showProfileMenu"
        class="absolute right-0 top-full mt-2 w-56 bg-card-dark border border-white/10 rounded-lg shadow-lg z-50"
      >
        <div class="py-2">
          <button
            *ngFor="let item of profileMenuItems"
            (click)="onProfileMenuItemClick(item)"
            [routerLink]="item.route"
            class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-white/10 hover:text-white transition-colors flex items-center gap-3"
            [class.text-red-400]="item.color === 'danger'"
            [class.border-t]="item.divider"
            [class.border-white/10]="item.divider"
          >
            <span
              *ngIf="item.icon"
              class="material-symbols-outlined text-lg"
              style="font-variation-settings: 'FILL' 0"
            >
              {{ item.icon }}
            </span>
            <span>{{ item.label }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
